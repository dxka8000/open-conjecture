name: Lean checker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record and proof-file gate
        run: node checker/gen_verified.mjs
      - uses: leanprover/lean-action@v1
        with:
          leanchecker: true
          axiom-audit: true
      - name: Judge
        run: bash checker/check_axioms.sh

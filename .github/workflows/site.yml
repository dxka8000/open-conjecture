name: Site
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *" # the public timeline also shows open, rejected and closed pull requests
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate records
        run: node checker/gen_verified.mjs
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/build.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
